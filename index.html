<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore yearly NASA POWER Earth science data for a place you choose.">
  <title>Earth System Trend Detective</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.chartReady = new Promise((resolve) => {
      const load = (source, fallback = false) => {
        const script = document.createElement('script');
        script.src = source;
        script.onload = () => resolve(true);
        script.onerror = () => fallback ? resolve(false) : load('vendor/chart.umd.min.js', true);
        document.head.append(script);
      };
      load('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.6.1/chart.umd.min.js');
    });
  </script>
  <script src="power-app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">NASA POWER · MONTHLY DATA</p>
      <h1>Earth System Trend Detective</h1>
      <p>Choose a place and variable to see its yearly record. Data come from satellite observations and atmospheric or land-surface reanalysis, not local ground stations.</p>
    </header>

    <form id="investigation-form">
      <label>Latitude
        <input id="latitude" name="latitude" type="number" min="-90" max="90" step="any" value="21.145" required>
      </label>
      <label>Longitude
        <input id="longitude" name="longitude" type="number" min="-180" max="180" step="any" value="79.088" required>
      </label>
      <label>Variable
        <select id="variable" name="variable">
          <option value="T2M">Air temperature (T2M)</option>
          <option value="PRECTOTCORR">Precipitation (PRECTOTCORR)</option>
          <option value="RH2M">Relative humidity (RH2M)</option>
          <option value="WS10M">Wind speed (WS10M)</option>
          <option value="ALLSKY_SFC_SW_DWN">Surface sunlight (ALLSKY_SFC_SW_DWN)</option>
        </select>
      </label>
      <label>Season
        <select id="season" name="season">
          <option value="annual">Annual</option>
          <option value="mam">MAM · March–May</option>
          <option value="jjas">JJAS · June–September</option>
          <option value="djf">DJF · December–February</option>
        </select>
      </label>
      <button type="submit">Run</button>
    </form>

    <p id="status" role="status" aria-live="polite">Ready to request a live NASA POWER record.</p>
    <section aria-labelledby="chart-title">
      <h2 id="chart-title">Yearly values</h2>
      <div class="chart-wrap"><canvas id="series-chart" aria-label="NASA POWER yearly values chart" role="img"></canvas></div>
    </section>
  </main>
</body>
</html>
